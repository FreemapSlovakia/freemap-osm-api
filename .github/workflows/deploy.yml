name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys overlap.
concurrency:
  group: deploy
  cancel-in-progress: false

# Nothing here uses the token.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT }} # optional; defaults to 22
          username: freemap
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # `set -e` in the script rather than the action's `script_stop`,
            # which is what this used to say: the input was dropped somewhere
            # in appleboy/ssh-action v1.x and is now ignored with only a
            # warning annotation, so the guard was not in force. Without it
            # every line runs and the step reports whatever the *last* one
            # returned — a `git reset` that could not find the commit would
            # rebuild and restart the old tree and still come out green.
            set -e

            cd /opt/freemap-osm-api
            # The server is a mirror of main, never a place to commit, so
            # overwrite it rather than merge: `git pull --ff-only` refuses once
            # the branch has diverged, and does so quietly enough that the
            # service keeps restarting on an old commit. Untracked files
            # (nothing here) are left alone.
            #
            # Pinned to the commit that triggered the run, not to whatever the
            # branch tip has become: two quick pushes would otherwise both
            # deploy the later tree, and the run reporting success for the
            # earlier commit would never have run it.
            git fetch origin main
            git reset --hard ${{ github.sha }}
            bash scripts/remote-deploy.sh
