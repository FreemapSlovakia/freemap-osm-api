# http-context settings for osm.freemap.sk. Install with
#   sudo cp etc/nginx/conf.d/nginx-osm.conf /etc/nginx/conf.d/

# The objects layer re-queries on every pan, so the limit has to sit well above
# a person panning fast while still bounding one address.
limit_req_zone $binary_remote_addr zone=osm_req:10m rate=20r/s;
